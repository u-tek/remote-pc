name: PC agent

on:
  push:
    branches: ['**']
    paths: ['agent/**', '.github/workflows/agent.yml']
  pull_request:
    paths: ['agent/**', '.github/workflows/agent.yml']
  workflow_dispatch:

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Windows helper smoke test (real PowerShell + Win32)
        if: runner.os == 'Windows'
        run: npm run smoke:windows
