name: iOS app

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project RemotePC.xcodeproj \
            -scheme RemotePC \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|unused)|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show compiler errors
        if: failure()
        working-directory: ios
        run: grep -B2 -A6 "error:" build.log | head -300 || true

      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/RemotePC.app dist/Payload/
          cd dist && zip -qry RemotePC.ipa Payload && ls -lh RemotePC.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RemotePC-ipa
          path: dist/RemotePC.ipa
          retention-days: 30

      - name: Put the IPA on main
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p builds
          cp dist/RemotePC.ipa builds/RemotePC.ipa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/RemotePC.ipa
          git commit -q -m "Build RemotePC.ipa from ${GITHUB_SHA::7}"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RemotePC.ipa
